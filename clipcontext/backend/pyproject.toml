[project]
name = "clipcontext-backend"
version = "0.1.0"
description = "ClipContext Part 1 backend: long video -> ranked vertical clips with evidence-grounded metadata"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "procrastinate>=3.0",
    "pydantic-ai-slim[google,groq]>=1.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "opencv-python-headless>=4.10,<5",
    "imagehash>=4.3",
    "pillow>=10",
    "fastembed>=0.5",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "indic-transliteration>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
